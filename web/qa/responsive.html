<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropConvoy responsive QA</title><style>
body{margin:0;background:#dce3dc;color:#09190d;font:14px system-ui}header{position:sticky;top:0;z-index:5;padding:12px;background:#fcfdf9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #9aad9d}button,select{padding:9px 12px;border:1px solid #8ea290;background:#f6f8f3;border-radius:6px;color:#09190d;cursor:pointer}main{padding:20px;overflow:auto}iframe{display:block;flex-shrink:0;height:820px;border:0;margin:auto;box-shadow:0 5px 30px #09190d30}#status{padding:8px;white-space:pre-wrap;font-size:12px}button[aria-pressed=true]{background:#153b20;color:#ecfef0}
</style></head><body><header><strong>Frontend QA</strong><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button><button id="theme">Toggle app theme</button><button id="text">200% text</button><select id="page" aria-label="Preview page"><option value="/">Landing</option><option value="/login?role=farmer">Farmer login</option><option value="/login?role=buyer">Buyer login</option><option value="/login?role=transporter">Transporter login</option></select><button id="check">Check layout</button></header><div id="status" role="status">Ready for responsive testing.</div><main><iframe title="CropConvoy responsive preview" src="/" width="390"></iframe></main><script type="module">
const frame=document.querySelector('iframe');let large=false;
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));check()}));
document.getElementById('theme').onclick=()=>{const button=[...frame.contentDocument.querySelectorAll('button')].find(b=>b.getAttribute('aria-label')?.startsWith('Switch to'));button?.click();setTimeout(check,100)};
document.getElementById('text').onclick=()=>{large=!large;frame.contentDocument.documentElement.style.fontSize=large?'200%':'';document.getElementById('text').setAttribute('aria-pressed',String(large));check()};
document.getElementById('page').onchange=event=>{frame.src='/#'+event.target.value;large=false};
function check(){const doc=frame.contentDocument;if(!doc)return;const overflow=doc.documentElement.scrollWidth>frame.contentWindow.innerWidth;const failed=[...doc.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'));document.getElementById('status').textContent=JSON.stringify({viewport:frame.contentWindow.innerWidth,theme:doc.documentElement.dataset.theme,horizontalOverflow:overflow,failedImages:failed,textScale:large?'200%':'100%'},null,2)}
document.getElementById('check').onclick=check;frame.addEventListener('load',()=>setTimeout(check,800));
</script></body></html>
