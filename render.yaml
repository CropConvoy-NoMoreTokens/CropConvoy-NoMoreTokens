# Match this name to the existing Render service before linking a Blueprint.
# Dashboard-managed services must also apply these build/start settings manually.
services:
  - type: web
    name: cropconvoy-api
    runtime: node
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_STUBS
        value: "false"
      - key: MAX_PLAN_MS
        value: "45000"
      - key: ROUTING_PROFILE
        value: driving
      - key: DATABASE_URL
        sync: false
      - key: ROUTING_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ML_API_BASE_URL
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: ML_REQUEST_TIMEOUT_MS
        value: "60000"
  - type: web
    name: cropconvoy-ml
    runtime: python
    plan: free
    # Run from the repository root so ml.server's package imports work.
    buildCommand: pip install -r ml/requirements-cpu.lock
    startCommand: python -m uvicorn ml.server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: ML_INFERENCE_DEVICE
        value: cpu
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: ML_API_KEY
        sync: false
